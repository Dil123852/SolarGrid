<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microgrid Nodes · SolarGrid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <main class="container pb-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div>
        <h1 class="h3 sg-page-title mb-0">Microgrid Nodes</h1>
        <p class="text-body-secondary mb-0">Solar hubs with their GPS location, capacity and battery storage slots.</p>
      </div>
      <div class="d-flex gap-2">
        <select class="form-select form-select-sm w-auto" id="activeFilter" aria-label="Filter nodes by status">
          <option value="">All nodes</option>
          <option value="true">Active only</option>
          <option value="false">Inactive only</option>
        </select>
        <button class="btn btn-primary" id="newNodeBtn" data-role="Backoffice"><i class="bi bi-plus-lg me-1"></i>New node</button>
      </div>
    </div>

    <div class="card sg-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr><th>Name</th><th>Location (lat, lng)</th><th class="text-end">Capacity (kWh)</th><th class="text-end">Battery slots</th><th>Status</th><th class="text-end" data-role="Backoffice">Actions</th></tr>
          </thead>
          <tbody id="nodeRows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="nodeModal" tabindex="-1" aria-labelledby="nodeModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="nodeForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="nodeModalTitle">New node</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="nId">
          <div class="mb-3">
            <label class="form-label" for="nName">Name</label>
            <input class="form-control" id="nName" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label" for="nLat">Latitude</label>
              <input class="form-control" id="nLat" type="number" step="any" min="-90" max="90" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="nLng">Longitude</label>
              <input class="form-control" id="nLng" type="number" step="any" min="-180" max="180" required>
            </div>
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label" for="nCapacity">Capacity (kWh)</label>
              <input class="form-control" id="nCapacity" type="number" step="any" min="0.1" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="nSlots">Battery slots</label>
              <input class="form-control" id="nSlots" type="number" step="1" min="1" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="nodeSaveBtn">Save node</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/services/services.js"></script>
  <script src="js/pages/nodes.js"></script>
</body>
</html>
