<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prosumers · SolarGrid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <main class="container pb-5">
    <div class="mb-4">
      <h1 class="h3 sg-page-title mb-0">Prosumers</h1>
      <p class="text-body-secondary mb-0">Solar property owners registered through the mobile app. Only Backoffice can reactivate an account.</p>
    </div>

    <ul class="nav nav-pills mb-3" id="tabs">
      <li class="nav-item">
        <button class="nav-link active" data-active="false"><i class="bi bi-hourglass-split me-1"></i>Pending activation <span class="badge text-bg-warning ms-1" id="pendingBadge">0</span></button>
      </li>
      <li class="nav-item"><button class="nav-link" data-active="">All prosumers</button></li>
    </ul>

    <div class="card sg-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr><th>NIC</th><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Registered</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody id="prosumerRows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/services/services.js"></script>
  <script src="js/pages/prosumers.js"></script>
</body>
</html>
