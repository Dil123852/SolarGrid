<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SolarGrid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <main class="sg-login d-flex align-items-center justify-content-center p-3">
    <div class="card sg-card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-sun-fill text-warning" style="font-size: 2.5rem"></i>
        <h1 class="h4 mt-2 mb-0 sg-page-title">SolarGrid</h1>
        <p class="text-body-secondary small mb-0">Smart Solar Microgrid Trading System · Staff portal</p>
      </div>

      <div id="flash" class="alert alert-warning small d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input id="username" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="alert alert-danger small d-none" role="alert"></div>
        <button id="loginBtn" type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
        </button>
      </form>

      <p class="text-body-secondary small text-center mt-4 mb-0">
        For Backoffice officers and Grid Operators. Prosumers use the SolarGrid mobile app.
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
