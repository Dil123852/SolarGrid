<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Users · SolarGrid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <main class="container pb-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div>
        <h1 class="h3 sg-page-title mb-0">Staff Users</h1>
        <p class="text-body-secondary mb-0">Backoffice officers and Grid Operators who can use this portal and operator mode.</p>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal"><i class="bi bi-person-plus me-1"></i>New user</button>
    </div>

    <div class="card sg-card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th class="text-end">Actions</th></tr>
          </thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="userForm" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="userModalTitle">Create staff user</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="uUsername">Username</label>
            <input class="form-control" id="uUsername" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="uEmail">Email</label>
            <input class="form-control" id="uEmail" type="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="uPassword">Password</label>
            <input class="form-control" id="uPassword" type="password" minlength="6" required>
            <div class="form-text">At least 6 characters.</div>
          </div>
          <div class="mb-1">
            <label class="form-label" for="uRole">Role</label>
            <select class="form-select" id="uRole">
              <option value="GridOperator">Grid Operator</option>
              <option value="Backoffice">Backoffice</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="userSaveBtn">Create user</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/services/services.js"></script>
  <script src="js/pages/users.js"></script>
</body>
</html>
