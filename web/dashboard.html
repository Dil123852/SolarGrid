<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · SolarGrid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <main class="container pb-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div>
        <h1 class="h3 sg-page-title mb-0">Dashboard</h1>
        <p class="text-body-secondary mb-0" id="greeting">Live reservation overview</p>
      </div>
      <button class="btn btn-outline-secondary btn-sm" id="refreshBtn"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card sg-card h-100"><div class="card-body d-flex align-items-center gap-3">
          <div class="sg-stat-icon text-bg-warning"><i class="bi bi-hourglass-split"></i></div>
          <div><div class="sg-stat" id="pendingCount">–</div><div class="text-body-secondary small">Pending approval</div></div>
        </div></div>
      </div>
      <div class="col-md-4">
        <div class="card sg-card h-100"><div class="card-body d-flex align-items-center gap-3">
          <div class="sg-stat-icon text-bg-success"><i class="bi bi-calendar-check"></i></div>
          <div><div class="sg-stat" id="approvedCount">–</div><div class="text-body-secondary small">Approved upcoming</div></div>
        </div></div>
      </div>
      <div class="col-md-4">
        <div class="card sg-card h-100"><div class="card-body d-flex align-items-center gap-3">
          <div class="sg-stat-icon text-bg-primary"><i class="bi bi-lightning-charge-fill"></i></div>
          <div><div class="sg-stat" id="completedCount">–</div><div class="text-body-secondary small">Transfers completed</div></div>
        </div></div>
      </div>
    </div>

    <div class="card sg-card">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <span class="fw-semibold">Next reservations awaiting approval</span>
        <a href="bookings.html?status=Pending" class="small">View all</a>
      </div>
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light"><tr><th>Slot</th><th>Node</th><th>Prosumer NIC</th><th>Status</th></tr></thead>
          <tbody id="pendingRows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/services/services.js"></script>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
